<svg width="1200" height="620" viewBox="0 0 1200 620" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="350" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="shadow" x="0" y="0" width="370" height="540" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="620" rx="16" fill="#0B1120"/>
  
  <!-- 功能卡片 1：农历与节假日日历 -->
  <g transform="translate(50, 45)">
    <g filter="url(#shadow)">
      <rect width="345" height="530" rx="16" fill="url(#cardBg)" stroke="#334155" stroke-width="1.5"/>
    </g>
    <text x="24" y="44" fill="#38BDF8" font-size="22">📅</text>
    <text x="58" y="45" fill="#F8FAFC" font-family="-apple-system, sans-serif" font-size="16" font-weight="bold">农历节气 &amp; 节假日</text>
    
    <!-- 自动折行介绍文本 -->
    <text x="24" y="78" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="12.5">内置轻量算法，精准支持 1900–2050 农历</text>
    <text x="24" y="98" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="12.5">转换与中秋、春节等传统节日高亮。</text>
    
    <!-- 模拟日历小格 -->
    <g transform="translate(24, 120)">
      <rect x="0" y="0" width="90" height="68" rx="8" fill="#0F172A" stroke="#3B82F6" stroke-width="2"/>
      <text x="12" y="26" fill="#3B82F6" font-family="-apple-system, sans-serif" font-size="16" font-weight="bold">10</text>
      <text x="45" y="52" fill="#FBBF24" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">教师节</text>
      
      <rect x="102" y="0" width="90" height="68" rx="8" fill="#0F172A" stroke="#334155"/>
      <text x="114" y="26" fill="#F8FAFC" font-family="-apple-system, sans-serif" font-size="16">11</text>
      <text x="147" y="52" fill="#FBBF24" font-family="-apple-system, sans-serif" font-size="12" text-anchor="middle">八月</text>
      
      <rect x="204" y="0" width="90" height="68" rx="8" fill="#0F172A" stroke="#334155"/>
      <text x="216" y="26" fill="#F8FAFC" font-family="-apple-system, sans-serif" font-size="16">12</text>
      <text x="249" y="52" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="12" text-anchor="middle">初二</text>
    </g>
    
    <text x="24" y="235" fill="#E2E8F0" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold">🌐 语言自适应模式：</text>
    <text x="24" y="265" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="12.5">• 中文 (zh)：农历初一/廿五 + 传统节日</text>
    <text x="24" y="292" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="12.5">• 英文 (en) / 西文 (es)：全球国际公共节假日</text>
    
    <text x="24" y="340" fill="#E2E8F0" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold">⌨️ 快捷键支持：</text>
    <text x="24" y="370" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="12.5">• Esc：关闭面板</text>
    <text x="24" y="395" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="12.5">• Cmd/Ctrl + K：快速新建提醒</text>
    <text x="24" y="420" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="12.5">• ← / →：快速翻看月份</text>
  </g>

  <!-- 功能卡片 2：待办 Checklist & 时间点选 -->
  <g transform="translate(425, 45)">
    <g filter="url(#shadow)">
      <rect width="345" height="530" rx="16" fill="url(#cardBg)" stroke="#334155" stroke-width="1.5"/>
    </g>
    <text x="24" y="44" fill="#34D399" font-size="22">✅</text>
    <text x="58" y="45" fill="#F8FAFC" font-family="-apple-system, sans-serif" font-size="16" font-weight="bold">待办清单 &amp; 状态流转</text>
    
    <text x="24" y="78" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="12.5">支持 Checkbox 一键打勾归档、红黄绿</text>
    <text x="24" y="98" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="12.5">三级优先级标色与 +15m / +1h 快捷推迟。</text>
    
    <!-- 模拟待办卡片 1 -->
    <g transform="translate(24, 120)">
      <rect x="0" y="0" width="297" height="62" rx="8" fill="#0F172A" stroke="#334155"/>
      <rect x="0" y="0" width="4" height="62" rx="2" fill="#EF4444"/>
      <rect x="14" y="14" width="14" height="14" rx="3" stroke="#64748B" fill="none"/>
      <text x="36" y="26" fill="#F8FAFC" font-family="-apple-system, sans-serif" font-size="12.5" font-weight="bold">给方案做技术评审</text>
      <text x="14" y="49" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="11">⏰ 14:00 (高优)</text>
      <rect x="180" y="37" width="34" height="17" rx="3" fill="#334155"/>
      <text x="197" y="49" fill="#CBD5E1" font-size="9.5" text-anchor="middle">+15m</text>
      <rect x="218" y="37" width="30" height="17" rx="3" fill="#334155"/>
      <text x="233" y="49" fill="#CBD5E1" font-size="9.5" text-anchor="middle">+1h</text>
      <text x="256" y="49" fill="#EF4444" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold">待提醒</text>
    </g>
    
    <!-- 模拟已完成卡片 2 -->
    <g transform="translate(24, 192)">
      <rect x="0" y="0" width="297" height="54" rx="8" fill="#0F172A" stroke="#334155" opacity="0.6"/>
      <rect x="0" y="0" width="4" height="54" rx="2" fill="#10B981"/>
      <rect x="14" y="14" width="14" height="14" rx="3" fill="#10B981"/>
      <path d="M16 21L19 24L25 17" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
      <text x="36" y="26" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="12.5">提交下半周工作计划</text>
      <line x1="36" y1="22" x2="155" y2="22" stroke="#94A3B8" stroke-width="1.2"/>
      <text x="14" y="44" fill="#64748B" font-family="-apple-system, sans-serif" font-size="11">⏰ 10:30</text>
      <text x="256" y="44" fill="#10B981" font-family="-apple-system, sans-serif" font-size="11">已完成</text>
    </g>
    
    <text x="24" y="280" fill="#E2E8F0" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold">⚡ 常用时间一键点选：</text>
    <g transform="translate(24, 298)">
      <rect x="0" y="0" width="66" height="24" rx="5" fill="#334155"/>
      <text x="33" y="16" fill="#CBD5E1" font-size="11" text-anchor="middle">09:00</text>
      <rect x="76" y="0" width="66" height="24" rx="5" fill="#334155"/>
      <text x="109" y="16" fill="#CBD5E1" font-size="11" text-anchor="middle">14:00</text>
      <rect x="152" y="0" width="66" height="24" rx="5" fill="#334155"/>
      <text x="185" y="16" fill="#CBD5E1" font-size="11" text-anchor="middle">18:00</text>
      <rect x="228" y="0" width="66" height="24" rx="5" fill="#334155"/>
      <text x="261" y="16" fill="#CBD5E1" font-size="11" text-anchor="middle">20:00</text>
    </g>
    
    <text x="24" y="355" fill="#E2E8F0" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold">🔍 即时搜索与过滤胶囊：</text>
    <text x="24" y="385" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="12.5">• 支持关键词秒级模糊匹配</text>
    <text x="24" y="410" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="12.5">• 一键切换「全部 / 待办 / 已完成」</text>
  </g>

  <!-- 功能卡片 3：系统级弹窗与 iCal 导出 -->
  <g transform="translate(800, 45)">
    <g filter="url(#shadow)">
      <rect width="345" height="530" rx="16" fill="url(#cardBg)" stroke="#334155" stroke-width="1.5"/>
    </g>
    <text x="24" y="44" fill="#F59E0B" font-size="22">🔔</text>
    <text x="58" y="45" fill="#F8FAFC" font-family="-apple-system, sans-serif" font-size="16" font-weight="bold">原生通知 &amp; iCal 导出</text>
    
    <text x="24" y="78" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="12.5">支持 macOS 与 Windows 10/11 原生通知</text>
    <text x="24" y="98" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="12.5">提醒、离线漏发补发与 .ics 日历导出。</text>
    
    <!-- 模拟系统通知弹窗卡片 -->
    <g transform="translate(24, 120)">
      <rect x="0" y="0" width="297" height="68" rx="12" fill="#0F172A" stroke="#475569" stroke-width="1.2"/>
      <circle cx="28" cy="34" r="14" fill="#3B82F6"/>
      <text x="21" y="40" fill="#FFFFFF" font-size="15">⏰</text>
      <text x="50" y="28" fill="#F8FAFC" font-family="-apple-system, sans-serif" font-size="12.5" font-weight="bold">DSH 智能提醒到期</text>
      <text x="50" y="48" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="11">给方案做技术评审 (14:00)</text>
    </g>
    
    <text x="24" y="235" fill="#E2E8F0" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold">📥 标准日历文件导出：</text>
    <text x="24" y="265" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="12.5">• 支持生成标准 .ics 格式文件</text>
    <text x="24" y="292" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="12.5">• 双击可直接导入 Apple 日历、Outlook</text>
    <text x="24" y="319" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="12.5">• 支持循环事件与定时闹钟触发</text>
    
    <text x="24" y="365" fill="#E2E8F0" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold">🔄 离线漏发智能补发：</text>
    <text x="24" y="395" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="12.5">• 开机后自动检测休眠期间的逾期事项</text>
    <text x="24" y="420" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="12.5">• 顶部横幅提醒并支持一键全部完成</text>
  </g>
</svg>
